estimatedMinutes: 40
prerequisites:
  - discord-webhook-automation/send-from-code/notify-script
authors: [github:TienNHM]
spec:
  checklist:
    - "Repo bài notify-script có .gitignore chứa .env và có .env.example không chứa giá trị thật"
    - "Đã tìm trong toàn bộ lịch sử commit (git log -p) và không thấy webhook URL thật"
    - "Đã tạo secret DISCORD_WEBHOOK_URL trong repo đó"
    - "Đã thêm workflow chạy bằng tay (workflow_dispatch) gửi được tin vào server riêng"
    - "Đã thử xóa một webhook cũ trong Discord và thấy URL cũ trả 404 Unknown Webhook"
